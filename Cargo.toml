[package]
name = "haiviz"
version = "0.4.3"
edition = "2024"

[dependencies]
macroquad = "0.4"
egui-macroquad = "0.17"
las = { version = "0.10", features = ["laz-parallel"] }
#console = "0.16"
miniquad = "0.4"
glam = { version="0.27" }
rfd = "0.15"
# Used directly for clipboard copies instead of egui/miniquad — see `set_clipboard`.
# `wayland-data-control` is what makes a copy land on the clipboard under Wayland.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
env_logger = "0.11"
log = "0.4"

[dev-dependencies]
criterion = "0.7"

# Phase 0 of docs/vectorisation-plan.md: the spatial index is the one part
# whose performance cannot be predicted by reading the code, so it is built
# with a bench rather than benched afterwards.
[[bench]]
name = "spatial"
harness = false

# Phase 5: whether a 512² trace really is a few milliseconds per anchor.
[[bench]]
name = "edge_follow"
harness = false
